[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "redox"
version = "0.1.0"
description = "A tiny, just-for-fun programming language written in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vishesh Jangid" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
redox = "redox.cli:main"

[project.urls]
Homepage = "https://github.com/visheshjangid01/Redox"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
